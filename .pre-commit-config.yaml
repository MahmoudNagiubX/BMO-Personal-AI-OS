repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: governance
        name: Repository governance and secret guard
        entry: uv run python scripts/verify_governance.py
        language: system
        pass_filenames: false
