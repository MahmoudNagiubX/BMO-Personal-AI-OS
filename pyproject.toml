[project]
name = "personal-ai-os"
version = "0.0.0"
description = "Local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Mahmoud" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "openjarvis==1.0.0",
  "psutil>=6,<8",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
voice = [
  "faster-whisper==1.2.1",
  "numpy>=2.2,<3",
  "onnxruntime==1.24.4",
  "openwakeword==0.6.0; sys_platform == 'win32' and python_version < '3.13'",
  "pipecat-ai==1.7.0",
  "sherpa-onnx==1.12.40",
  "silero-vad==6.2.1",
  "sounddevice==0.5.6",
  "torch>=2.7,<3",
]
voice-training = [
  "onnx>=1.16,<2",
  "onnxscript>=0.2,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai_os", "packages/openjarvis_adapter/src/bmo_openjarvis_adapter"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "websockets>=15,<16",
  "types-psutil>=7.2.2.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "packages/openjarvis_adapter/src", "."]
markers = [
  "integration: tests that require a real PostgreSQL/pgvector database",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "scripts", "packages/openjarvis_adapter/src"]
exclude = ["tests"]
