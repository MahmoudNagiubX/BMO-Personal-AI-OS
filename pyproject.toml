[project]
name = "personal-ai-os"
version = "0.0.0"
description = "Local-first personal AI operating system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Mahmoud" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai_os"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "httpx>=0.28,<1",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: tests that require a real PostgreSQL/pgvector database",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "scripts"]
exclude = ["tests"]
