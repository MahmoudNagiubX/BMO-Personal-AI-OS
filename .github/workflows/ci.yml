name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phase-two-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BMO_ENVIRONMENT: test
      BMO_DATABASE_URL: postgresql+psycopg://bmo:bmo_ci_only@127.0.0.1:5432/bmo_test
      BMO_TEST_DATABASE_URL: postgresql+psycopg://bmo:bmo_ci_only@127.0.0.1:5432/bmo_test
    services:
      postgres:
        image: pgvector/pgvector:pg16-bookworm
        env:
          POSTGRES_DB: bmo_test
          POSTGRES_USER: bmo
          POSTGRES_PASSWORD: bmo_ci_only
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U bmo -d bmo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          version: "0.12.1"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --group dev --locked

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if uv run python -c '
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(
              os.environ["BMO_TEST_DATABASE_URL"],
              connect_args={"connect_timeout": 2},
              pool_pre_ping=True,
          )
          try:
              with engine.connect() as connection:
                  connection.execute(text("SELECT 1")).scalar_one()
          except Exception:
              raise SystemExit(1)
          finally:
              engine.dispose()
          '; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become reachable within the retry window"
          exit 1

      - name: Apply and validate migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Run full validation
        run: uv run python scripts/check.py
