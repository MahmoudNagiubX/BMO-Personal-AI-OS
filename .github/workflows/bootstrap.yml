name: Validate retained bootstrap archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00
          test -f .bootstrap/chunk-05
          cat .bootstrap/chunk-* > /tmp/bundle.b64
          base64 --decode /tmp/bundle.b64 > /tmp/starter.zip
          unzip -t /tmp/starter.zip

      - name: Inspect starter repository contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 /tmp/starter.zip | grep -Fx 'personal-ai-os/AGENTS.md'
          unzip -Z1 /tmp/starter.zip | grep -Fx 'personal-ai-os/docs/MASTER_PLAN.md'
