name: Unpack repository bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/chunk-00
          test -f .bootstrap/chunk-05
          cat .bootstrap/chunk-* > /tmp/bundle.b64
          base64 --decode /tmp/bundle.b64 > /tmp/starter.zip
          unzip -t /tmp/starter.zip

      - name: Install starter repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unpack
          unzip -q /tmp/starter.zip -d /tmp/unpack
          test -f /tmp/unpack/personal-ai-os/AGENTS.md
          test -f /tmp/unpack/personal-ai-os/docs/MASTER_PLAN.md
          cp -a /tmp/unpack/personal-ai-os/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit Phase 0 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(phase-00): establish repository governance baseline"
          git push
