name: Phase task
description: A bounded implementation task within the active phase
title: "[Phase XX] "
labels: ["phase-task"]
body:
  - type: input
    id: task_id
    attributes:
      label: Task ID
      placeholder: P2-01
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
    validations:
      required: true
